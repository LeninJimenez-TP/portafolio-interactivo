<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio Interactivo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Mi Portafolio</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="#">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="#proyectos">Proyectos</a></li>
                    <li class="nav-item"><a class="nav-link" href="#contacto">Contacto</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        
        <div class="text-center mb-5">
            <h1 class="texto-deslizante">Bienvenido a mi Portafolio Interactivo</h1>
            <!-- Loader de carga circular[cite: 5] -->
            <div class="cargador mx-auto mt-3"></div>
        </div>

        <section id="proyectos" class="mb-5">
            <h2 class="mb-4 text-center">Transformaciones 2D</h2>
            <div class="row g-4 text-center">
                <div class="col-sm-12 col-md-4">
                    <div class="card-proyecto caja-rotar">Caja 1: Rotar (rotate)</div>
                </div>
                <div class="col-sm-12 col-md-4">
                    <div class="card-proyecto caja-escalar">Caja 2: Escalar (scale)</div>
                </div>
                <div class="col-sm-12 col-md-4">
                    <div class="card-proyecto caja-sesgar">Caja 3: Sesgar (skew)</div>
                </div>
            </div>
        </section>

        <section class="mb-5 text-center">
            <h2 class="mb-4">Transformación 3D</h2>
            <div class="contenedor-3d mx-auto">
                <div class="elemento-3d">
                    <div class="cara frente">Frente 3D</div>
                    <div class="cara atras">Atrás 3D</div>
                </div>
            </div>
        </section>

        <section id="contacto" class="row justify-content-center">
            <div class="col-sm-12 col-md-8 bg-light p-4 rounded shadow-sm">
                <h2 class="mb-3 text-center">Formulario de Contacto</h2>
                <form>
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="nombre" placeholder="Tu nombre">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" placeholder="name@example.com">
                    </div>
                    <div class="mb-3">
                        <label for="mensaje" class="form-label">Mensaje</label>
                        <textarea class="form-control" id="mensaje" rows="3" placeholder="Escribe tu mensaje..."></textarea>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Enviar</button>
                        <button type="reset" class="btn btn-secondary">Limpiar</button>
                    </div>
                </form>
            </div>
        </section>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
